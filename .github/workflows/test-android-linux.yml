name: Test Android Linux Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  build-android:
    needs: build-android-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      OPERIT_LIBCLANG_DIR: /usr/lib/llvm-21/lib
      OPERIT_ANDROID_V8_JOBS: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime
          path: apps/flutter/app/android/app/src/main

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install LLVM 21 and build helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release python3-venv
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev libclang-21-dev lld-21 clang-21
          sudo ln -sf /usr/lib/llvm-21/lib/libclang.so /usr/lib/llvm-21/lib/libclang.so.21
          sudo ln -sf /usr/lib/llvm-21/bin/clang /usr/local/bin/clang
          sudo ln -sf /usr/lib/llvm-21/bin/wasm-ld /usr/local/bin/wasm-ld
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          clang --version | head -1
          wasm-ld --version

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android

      - name: Prepare Python and Node build helpers
        run: |
          python3 -m venv .venv
          .venv/bin/python --version
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          corepack enable
          corepack pnpm --version

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .ci-tools/emsdk
          cd .ci-tools/emsdk
          ./emsdk install 4.0.14
          ./emsdk activate 4.0.14
          source ./emsdk_env.sh
          echo "EMSDK=$PWD" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$PWD/.emscripten" >> "$GITHUB_ENV"
          echo "$PWD/upstream/emscripten" >> "$GITHUB_PATH"
          test -f upstream/emscripten/em++

      - name: Restore Android signing material
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p tools/release/secrets
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > tools/release/secrets/operit2-release.keystore
          cat > tools/release/secrets/android-signing.properties <<PROPERTIES
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD
          PROPERTIES

      - name: Restore source-built Android V8
        uses: actions/cache/restore@v4
        with:
          path: tools/release/work/android-v8/152.2.0/aarch64-linux-android
          key: ${{ runner.os }}-${{ runner.arch }}-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Build and package Android app
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=1000"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail
          read -r BUILD_NAME BUILD_NUMBER < <(python3 -c "import re,pathlib; s=pathlib.Path('apps/flutter/app/pubspec.yaml').read_text(); m=re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', s, re.M); print(m.group(1), m.group(2))")
          echo "building $BUILD_NAME+$BUILD_NUMBER"
          python3 tools/build_scripts/build_flutter_android.py --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" --enforce-lockfile

      - name: Save source-built Android V8
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tools/release/work/android-v8/152.2.0/aarch64-linux-android
          key: ${{ runner.os }}-${{ runner.arch }}-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: operit2-test-apk
          path: tools/release/dist/*.apk
          if-no-files-found: error
          retention-days: 14
